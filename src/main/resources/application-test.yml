spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/meterflow_test
    username: meterflow
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info